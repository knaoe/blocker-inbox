<style>
/* Layout: one phone-width column under a sticky tally bar. Your own decisions come first as full
   cards; everyone else's are compact rows grouped by owner; answered and finished items fold away. */
:root {
  --bg: #EEF1F5;
  --surface: #FFFFFF;
  --surface-2: #F5F7FA;
  --chip: #E6EAF0;
  --ink: #121722;
  --muted: #525C6F;
  --line: #D5DBE5;
  --line-strong: #8792A5;
  --accent: #2346C8;
  --on-accent: #FFFFFF;
  --on-accent-muted: #DCE3FF;
  --accent-soft: #E4EAFF;
  --warn: #8A4B00;
  --warn-soft: #FFF0D1;
  --alert: #B3261E;
  --alert-soft: #FDE7E4;
  --alert-line: #E3A49D;
  --ok: #1B6B3A;
  --ok-soft: #E3F3E8;
  --stake-bg: #121722;
  --stake-fg: #FFFFFF;
  --focus: #2346C8;
  --shadow: 0 10px 28px rgb(16 22 34 / 0.22);

  --font-ui: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
  --font-mono: "Spline Sans Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --fs-xs: 0.75rem;
  --fs-s: 0.8125rem;
  --fs-m: 0.9375rem;
  --fs-l: 1.0625rem;
  --fs-xl: 1.25rem;
  --r-card: 14px;
  --r-ctl: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1117; --surface: #161B24; --surface-2: #1C2230; --chip: #252C3A;
    --ink: #E6E9EF; --muted: #A1ABBD; --line: #2A3242; --line-strong: #66728C;
    --accent: #9DB4FF; --on-accent: #0B1020; --on-accent-muted: #26324F; --accent-soft: #1E2A4A;
    --warn: #F5B961; --warn-soft: #382A12;
    --alert: #FF8E85; --alert-soft: #3B1815; --alert-line: #7A3A33;
    --ok: #7DD8A0; --ok-soft: #13301F;
    --stake-bg: #E6E9EF; --stake-fg: #121722;
    --focus: #9DB4FF;
    --shadow: 0 10px 28px rgb(0 0 0 / 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1117; --surface: #161B24; --surface-2: #1C2230; --chip: #252C3A;
  --ink: #E6E9EF; --muted: #A1ABBD; --line: #2A3242; --line-strong: #66728C;
  --accent: #9DB4FF; --on-accent: #0B1020; --on-accent-muted: #26324F; --accent-soft: #1E2A4A;
  --warn: #F5B961; --warn-soft: #382A12;
  --alert: #FF8E85; --alert-soft: #3B1815; --alert-line: #7A3A33;
  --ok: #7DD8A0; --ok-soft: #13301F;
  --stake-bg: #E6E9EF; --stake-fg: #121722;
  --focus: #9DB4FF;
  --shadow: 0 10px 28px rgb(0 0 0 / 0.5);
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: var(--fs-m);
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}
button, input, textarea, select { font-family: inherit; }
/* Japanese: break lines between phrases, not inside them (Chromium; others fall back to normal). */
.card-title, .row-t, .summary, .opt .lbl, .ans-t, .sec-h { word-break: auto-phrase; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* Tally bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 10px; display: flex; align-items: center; gap: 12px; }
.brand { display: grid; min-width: 0; margin: 0; font-size: inherit; font-weight: inherit; }
.mark { font-family: var(--font-mono); font-weight: 600; font-size: var(--fs-m); letter-spacing: 0.01em; line-height: 1.3; }
.sub { font-size: var(--fs-xs); color: var(--muted); line-height: 1.4; }
.badge { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: var(--fs-xs); white-space: nowrap; }
.badge .n { font-family: var(--font-mono); font-size: var(--fs-l); line-height: 1; font-variant-numeric: tabular-nums; }
.badge.is-clear { background: var(--ok-soft); color: var(--ok); }
.badge[hidden] { display: none; }

/* Page column */
.wrap { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 128px; display: grid; gap: 12px; }
.wrap > * { min-width: 0; }
.summary { margin: 2px 0 0; font-size: var(--fs-l); line-height: 1.6; font-weight: 700; text-wrap: pretty; }
.summary .urg { color: var(--alert); }
.banner { margin: 0; padding: 10px 12px; border-radius: 10px; font-size: var(--fs-s); background: var(--surface-2); border: 1px dashed var(--line-strong); }
.banner.is-err { border-style: solid; border-color: var(--alert-line); background: var(--alert-soft); }

.sec-h { display: flex; align-items: baseline; gap: 8px; margin: 14px 0 0; font-size: var(--fs-m); font-weight: 700; line-height: 1.4; }
.sec-h .n { font-family: var(--font-mono); font-size: var(--fs-s); color: var(--muted); font-variant-numeric: tabular-nums; }
.subhead { margin: 2px 0 -4px; display: flex; align-items: center; gap: 6px; font-size: var(--fs-xs); font-weight: 700; color: var(--alert); letter-spacing: 0.04em; }
.subhead.is-rest { color: var(--muted); }
.group-h { margin: 6px 0 -4px; display: flex; align-items: baseline; gap: 6px; font-size: var(--fs-s); font-weight: 700; color: var(--muted); line-height: 1.4; }
.group-h .n { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.empty { margin: 0; padding: 14px 16px; border-radius: var(--r-card); background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: var(--fs-s); }

/* Card */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px; display: grid; gap: 10px; min-width: 0; }
.card.is-urgent { border-color: var(--alert-line); }
.card-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.card-title { margin: 0; font-size: var(--fs-l); line-height: 1.45; font-weight: 700; text-wrap: balance; overflow-wrap: anywhere; }
.card-title:focus { outline: none; }
.card-title:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; border-radius: 4px; }
.blocked, .why { margin: 0; font-size: var(--fs-s); line-height: 1.55; overflow-wrap: anywhere; }
.blocked-k { color: var(--muted); margin-right: 6px; }
.why { color: var(--muted); }
.notice { margin: 0; padding: 8px 10px; border-radius: 8px; font-size: var(--fs-s); background: var(--warn-soft); }
.notice.is-subtle { background: var(--surface-2); color: var(--muted); }
.auto { margin: 0; display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: 8px; font-size: var(--fs-s); background: var(--accent-soft); }
.auto .ic { margin-top: 3px; }

.pill { display: inline-flex; align-items: center; gap: 4px; padding: 5px 9px; border-radius: 999px; background: var(--chip); color: var(--muted); font-size: var(--fs-xs); font-weight: 700; line-height: 1.2; white-space: nowrap; }
.pill.is-stale { background: var(--warn-soft); color: var(--warn); }
.pill.is-urgent { background: var(--alert-soft); color: var(--alert); }
.pill .ic { width: 13px; height: 13px; }
.stake { display: inline-flex; align-items: center; gap: 4px; padding: 5px 8px 5px 6px; border-radius: 6px; background: var(--stake-bg); color: var(--stake-fg); font-size: var(--fs-xs); font-weight: 700; line-height: 1.2; white-space: nowrap; }
.stake .ic { width: 13px; height: 13px; }
.chip-demo { display: inline-flex; padding: 4px 8px; border-radius: 6px; border: 1px dashed var(--line-strong); color: var(--muted); font-size: var(--fs-xs); font-weight: 700; line-height: 1.2; }
.proj { font-size: var(--fs-xs); color: var(--muted); }

/* Options */
.opts { display: grid; gap: 8px; }
.opt {
  all: unset; box-sizing: border-box; cursor: pointer; width: 100%; min-height: 56px;
  display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; column-gap: 12px; row-gap: 2px; align-items: center;
  padding: 12px 14px; border-radius: var(--r-ctl); border: 1.5px solid var(--line-strong);
  background: var(--surface); color: var(--ink); text-align: left;
}
.opt:hover { border-color: var(--ink); }
.opt:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.opt .k { grid-row: 1 / span 3; align-self: start; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; border: 1.5px solid currentColor; font-family: var(--font-mono); font-weight: 600; font-size: var(--fs-s); }
.opt .lbl { grid-column: 2; font-weight: 700; font-size: var(--fs-m); line-height: 1.4; overflow-wrap: anywhere; }
.opt .tag { grid-column: 3; grid-row: 1; padding: 3px 8px; border-radius: 999px; background: var(--on-accent); color: var(--accent); font-size: var(--fs-xs); font-weight: 700; line-height: 1.3; white-space: nowrap; }
.opt .cons, .opt .rsn { grid-column: 2 / 4; font-size: var(--fs-s); line-height: 1.5; overflow-wrap: anywhere; }
.opt .cons { color: var(--muted); }
.opt .rsn b { margin-right: 6px; }
.opt.is-rec { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.opt.is-rec .cons, .opt.is-rec .rsn { color: var(--on-accent-muted); }
.opt.is-rec .rsn b { color: var(--on-accent); }
.opt.is-picked { outline: 3px solid var(--alert); outline-offset: 2px; }
.opt:disabled { cursor: default; opacity: 0.55; }

.confirm { display: grid; gap: 10px; padding: 14px; border-radius: var(--r-ctl); background: var(--alert-soft); border: 1.5px solid var(--alert-line); }
.confirm p { margin: 0; font-size: var(--fs-s); line-height: 1.55; }
.confirm strong { color: var(--alert); }

/* Secondary actions and panels */
.acts { display: flex; flex-wrap: wrap; gap: 0 18px; margin-top: -2px; }
.link-btn { all: unset; cursor: pointer; padding: 12px 2px; color: var(--accent); font-weight: 700; font-size: var(--fs-s); line-height: 1.3; }
.link-btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.link-btn[aria-expanded="true"] { text-decoration: underline; text-underline-offset: 4px; }
.link-btn:disabled { color: var(--muted); cursor: default; }
.panel { display: grid; gap: 10px; padding: 14px; border-radius: var(--r-ctl); background: var(--surface-2); border: 1px solid var(--line); }
.panel-l { margin: 0; font-size: var(--fs-s); font-weight: 700; }
.field { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 8px; border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: 16px; line-height: 1.5; }
textarea.field { resize: vertical; min-height: 84px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { all: unset; box-sizing: border-box; cursor: pointer; min-height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: var(--fs-s); font-weight: 700; line-height: 1.3; }
.chip:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.chip[aria-checked="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.chip .k { font-family: var(--font-mono); }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { all: unset; box-sizing: border-box; cursor: pointer; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; padding: 10px 18px; border-radius: var(--r-ctl); border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: var(--fs-s); font-weight: 700; line-height: 1.3; text-align: center; }
.btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.btn.is-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.is-danger { background: var(--alert); border-color: var(--alert); color: var(--surface); }
.btn:disabled { cursor: default; opacity: 0.5; }

/* Meta and evidence */
.meta { display: grid; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); font-size: var(--fs-xs); color: var(--muted); line-height: 1.5; }
.meta-line { margin: 0; display: flex; flex-wrap: wrap; gap: 2px 12px; }
.asker { font-family: var(--font-mono); }
.due.is-over { color: var(--alert); font-weight: 700; }
.evs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.evs-k { margin-right: 2px; }
.ev { display: inline-flex; align-items: center; gap: 4px; min-height: 32px; box-sizing: border-box; padding: 4px 10px; border-radius: 999px; background: var(--chip); color: var(--ink); font-size: var(--fs-xs); font-weight: 700; text-decoration: none; overflow-wrap: anywhere; }
a.ev:hover { text-decoration: underline; }
.ev .ic { width: 12px; height: 12px; }

/* Batch */
.batch { display: grid; gap: 10px; padding: 12px 14px; border-radius: var(--r-ctl); background: var(--accent-soft); }
.batch p { margin: 0; font-size: var(--fs-s); font-weight: 700; }
.batch-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.batch-list label { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px; border-radius: 8px; background: var(--surface); cursor: pointer; font-size: var(--fs-s); line-height: 1.5; }
.batch-list input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--accent); }
.batch-list .pick { display: block; color: var(--muted); }

/* Rows for other owners */
.row { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-ctl); }
.row.is-urgent { border-color: var(--alert-line); }
.row > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 12px 14px; min-height: 48px; box-sizing: border-box; }
.row > summary::-webkit-details-marker { display: none; }
.row > summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: var(--r-ctl); }
.row-main { display: grid; gap: 6px; min-width: 0; }
.row-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.row-t { font-weight: 700; font-size: var(--fs-m); line-height: 1.45; overflow-wrap: anywhere; }
.row-auto { font-size: var(--fs-xs); color: var(--muted); line-height: 1.5; }
.chev { width: 18px; height: 18px; color: var(--muted); }
.row[open] > summary { border-bottom: 1px solid var(--line); }
.row[open] .chev { transform: rotate(180deg); }
.row > .card { border: 0; border-radius: 0 0 var(--r-ctl) var(--r-ctl); }

/* Folded sections */
.fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; min-height: 44px; font-size: var(--fs-m); font-weight: 700; }
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary .n { font-family: var(--font-mono); font-size: var(--fs-s); color: var(--muted); }
.fold[open] .chev { transform: rotate(180deg); }
.fold-list { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 8px; }
.ans-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 12px 14px; border-radius: var(--r-ctl); background: var(--surface); border: 1px solid var(--line); }
.ans-row > div { min-width: 0; display: grid; gap: 2px; }
.ans-t { font-weight: 700; font-size: var(--fs-s); line-height: 1.45; overflow-wrap: anywhere; }
.ans-a { display: flex; gap: 6px; align-items: center; color: var(--ok); font-size: var(--fs-s); font-weight: 700; overflow-wrap: anywhere; }
.ans-n, .ans-time { color: var(--muted); font-size: var(--fs-xs); overflow-wrap: anywhere; }

/* Help */
.help { margin-top: 18px; border-top: 1px solid var(--line); font-size: var(--fs-s); color: var(--muted); }
.help > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; min-height: 48px; color: var(--ink); font-weight: 700; }
.help > summary::-webkit-details-marker { display: none; }
.help[open] .chev { transform: rotate(180deg); }
.help-body { display: grid; gap: 12px; padding-bottom: 8px; }
.help-body p { margin: 0; line-height: 1.65; }
.help-body ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.help-body li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.help-body a { color: var(--accent); font-weight: 700; }
.help-self { display: grid; gap: 6px; }
.help-self label { color: var(--ink); font-weight: 700; }
.help-self select { justify-self: start; max-width: 100%; padding: 8px 10px; border-radius: 8px; border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: 16px; }

/* Loading */
.skel { display: grid; gap: 10px; padding: 16px; border-radius: var(--r-card); background: var(--surface); border: 1px solid var(--line); }
.skel i { display: block; height: 12px; border-radius: 6px; background: var(--chip); }
.skel i:nth-child(1) { width: 40%; } .skel i:nth-child(2) { width: 85%; height: 16px; } .skel i:nth-child(3) { width: 65%; }

/* Toast */
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 10; max-width: 560px; margin-inline: auto; display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 16px; border-radius: 12px; background: var(--ink); color: var(--surface); box-shadow: var(--shadow); }
.toast-msg { flex: 1; min-width: 0; font-size: var(--fs-s); font-weight: 700; line-height: 1.4; overflow-wrap: anywhere; }
.toast .btn { background: transparent; border-color: var(--muted); color: var(--surface); }

@media (prefers-reduced-motion: no-preference) {
  .chev { transition: transform 0.15s ease; }
  .toast:not([hidden]) { animation: toast-in 0.18s ease-out; }
  @keyframes toast-in { from { transform: translateY(8px); opacity: 0.4; } to { transform: none; opacity: 1; } }
}
</style>

  /* ===== 3. Small helpers ===== */
  const HOUR = 3600e3;
  const $ = (id) => document.getElementById(id);
  const str = (v) => (typeof v === "string" ? v.trim() : "");
  const ms = (v) => { const n = typeof v === "string" ? Date.parse(v) : NaN; return Number.isFinite(n) ? n : null; };
  const isWebLink = (u) => /^https?:\/\/[^\s]+$/i.test(u);

  let lang = "ja";
  let dict = STRINGS.ja;
  let fmtTime = null;

  function setLocale(pref) {
    const auto = (navigator.language || "en").toLowerCase().startsWith("ja") ? "ja" : "en";
    const want = pref && pref !== "auto" ? pref : auto;
    lang = STRINGS[want] ? want : "en";
    dict = STRINGS[lang];
    document.documentElement.lang = lang;
    fmtTime = new Intl.DateTimeFormat(lang === "ja" ? "ja-JP" : "en-GB", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
  }
  function t(key, vars) {
    let s = (vars && vars.n === 1 && dict[key + "_one"]) || dict[key] || STRINGS.en[key] || key;
    if (vars) s = s.replace(/\{(\w+)\}/g, (_, k) => (vars[k] == null ? "" : String(vars[k])));
    return s;
  }
  function dur(span) {
    const m = Math.max(1, Math.round(Math.abs(span) / 60000));
    if (m < 60) return t("durMin", { n: m });
    const hours = Math.floor(m / 60);
    if (hours < 72) return t("durHour", { n: hours });
    return t("durDay", { n: Math.floor(hours / 24) });
  }
  const at = (when) => fmtTime.format(new Date(when));
  const quote = (s) => t("quoteOpen") + s + t("quoteClose");

  const local = {
    get(k) { try { return localStorage.getItem(SETTINGS.storageKey + ":" + k); } catch (_) { return null; } },
    set(k, v) { try { if (v == null) localStorage.removeItem(SETTINGS.storageKey + ":" + k); else localStorage.setItem(SETTINGS.storageKey + ":" + k, v); } catch (_) {} },
  };

  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : String(v));
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid == null || kid === false) continue;
      el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }
  function icon(name) {
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("class", "ic");
    svg.setAttribute("aria-hidden", "true");
    svg.setAttribute("focusable", "false");
    const use = document.createElementNS(ns, "use");
    use.setAttribute("href", "#i-" + name);
    svg.append(use);
    return svg;
  }

  /* ===== 4. State ===== */
  const S = {
    mode: "loading",          // loading | live | demo
    loaded: false,
    items: new Map(),         // id -> normalized item
    answers: new Map(),       // item id -> answer
    config: { v: 1 },
    userId: null,
    readOnly: false,
    fatal: "",
    open: new Set(),          // expanded rows and folded sections
    panel: null,              // { id, type: "reply" | "reassign" }
    confirm: null,            // { id, key } while a marked item waits for its second tap
    batchOpen: false,
    batchSkip: new Set(),
    drafts: new Map(),        // id -> note text (reply)
    rdrafts: new Map(),       // id -> note text (reassign)
    pick: new Map(),          // id -> option key picked inside the reply panel
    to: new Map(),            // id -> owner key picked inside the reassign panel ("" = don't know)
    busy: new Set(),
    tiers: "",
  };
  let store = null;
  let guardUntil = 0;
  const guard = (span) => { guardUntil = Date.now() + span; };
  const guarded = () => Date.now() < guardUntil;

  /* ===== 5. Stores. Each one: start(handlers), writeAnswer(id, answer), deleteAnswer(id). ===== */
  function liveStore(db) {
    return {
      start({ onItems, onAnswers, onConfig, onError }) {
        db.collection("items").onSnapshot((snap) => onItems(snap.docs.map((d) => ({ ...d.data(), id: d.id }))), onError);
        db.collection("answers").onSnapshot((snap) => onAnswers(snap.docs.map((d) => ({ ...d.data(), item_id: d.id }))), onError);
        db.doc("config/inbox").onSnapshot((d) => onConfig(d.exists ? d.data() : null), onError);
      },
      writeAnswer: (id, answer) => db.doc("answers/" + id).set(answer),
      deleteAnswer: (id) => db.doc("answers/" + id).delete(),
    };
  }

  function demoStore() {
    let data = {};
    try { data = JSON.parse($("demo-data").textContent); } catch (_) {}
    const shift = Date.now() - (ms(data.anchor) || Date.now());
    const move = (v) => (ms(v) == null ? v : new Date(ms(v) + shift).toISOString());
    const items = ((data.items && (data.items[lang] || data.items.en)) || []).map((it) => ({
      ...it,
      asked_at: move(it.asked_at), reasked_at: move(it.reasked_at), due: move(it.due), done_at: move(it.done_at),
      if_no_answer: it.if_no_answer ? { ...it.if_no_answer, at: move(it.if_no_answer.at) } : undefined,
    }));
    const answers = new Map((data.answers || []).map((a) => [a.item_id, { ...a, answered_at: move(a.answered_at) }]));
    let push = () => {};
    return {
      start({ onItems, onAnswers, onConfig }) {
        push = () => onAnswers([...answers.values()]);
        onConfig((data.config && (data.config[lang] || data.config.en)) || null);
        onItems(items);
        push();
      },
      writeAnswer: async (id, answer) => { answers.set(id, answer); push(); },
      deleteAnswer: async (id) => { answers.delete(id); push(); },
    };
  }

  /* ===== 6. Reading what agents wrote (be forgiving: render what makes sense, skip the rest) ===== */
  function normalize(raw) {
    const it = { id: str(raw.id), sig: JSON.stringify(raw) };
    it.rev = Number.isInteger(raw.rev) && raw.rev > 0 ? raw.rev : 1;
    it.status = raw.status === "done" ? "done" : "open";
    it.title = str(raw.title) || t("untitled");
    it.why = str(raw.why);
    it.blocked = str(raw.blocked);
    it.owner = str(raw.owner);
    it.asker = str(raw.asker);
    it.project = str(raw.project);
    it.options = (Array.isArray(raw.options) ? raw.options : [])
      .filter((o) => o && str(o.key) && str(o.label))
      .slice(0, 4)
      .map((o) => ({ key: str(o.key), label: str(o.label), consequence: str(o.consequence) }));
    const rec = raw.recommend && it.options.find((o) => o.key === str(raw.recommend.key));
    it.recommend = rec ? { key: rec.key, reason: str(raw.recommend.reason) } : null;
    it.stakes = Array.isArray(raw.stakes) ? STAKES.filter((s) => raw.stakes.includes(s)) : [];
    it.blocking = raw.blocking !== false;
    it.evidence = (Array.isArray(raw.evidence) ? raw.evidence : []).filter((l) => l && str(l.label)).slice(0, 5)
      .map((l) => ({ label: str(l.label), url: str(l.url) }));
    it.askedMs = ms(raw.asked_at);
    it.reaskedMs = ms(raw.reasked_at);
    it.dueMs = ms(raw.due);
    it.doneMs = ms(raw.done_at);
    it.outcome = str(raw.outcome);
    it.demo = raw.demo === true;
    const fallback = raw.if_no_answer && it.options.find((o) => o.key === str(raw.if_no_answer.key));
    it.ifNo = fallback && ms(raw.if_no_answer.at) != null ? { atMs: ms(raw.if_no_answer.at), key: fallback.key, label: fallback.label } : null;
    return it;
  }

  function ownerMap() {
    const map = new Map();
    for (const o of Array.isArray(S.config.owners) ? S.config.owners : []) {
      if (o && str(o.key)) map.set(str(o.key), str(o.label) || str(o.key));
    }
    for (const it of S.items.values()) if (it.owner && !map.has(it.owner)) map.set(it.owner, it.owner);
    return map;
  }
  const selfKey = () => local.get("self") || str(S.config.self) || "me";

  /* ===== 7. Deriving the view ===== */
  function tierOf(it, now) {
    const age = it.askedMs == null ? 0 : now - it.askedMs;
    const overdue = it.status === "open" && it.dueMs != null && it.dueMs < now;
    const urgent = age >= SETTINGS.blockerHours * HOUR || overdue;
    const stale = !urgent && age >= SETTINGS.staleHours * HOUR;
    return { overdue, urgent, tier: urgent ? "urgent" : stale ? "stale" : "fresh" };
  }
  function byUrgency(a, b) {
    return (a.urgent === b.urgent ? 0 : a.urgent ? -1 : 1)
      || (a.it.blocking === b.it.blocking ? 0 : a.it.blocking ? -1 : 1)
      || ((a.it.dueMs ?? Infinity) - (b.it.dueMs ?? Infinity))
      || ((a.it.askedMs ?? 0) - (b.it.askedMs ?? 0))
      || a.it.id.localeCompare(b.it.id);
  }
  function derive(now) {
    const self = selfKey();
    const out = { self, mine: [], others: [], answered: [], done: [] };
    for (const it of S.items.values()) {
      const ans = S.answers.get(it.id) || null;
      const applies = !!ans && (Number(ans.item_rev) || 1) === it.rev;
      const v = { it, ans: applies ? ans : null, prev: ans && !applies ? ans : null, ...tierOf(it, now) };
      if (it.status === "done") {
        if (it.doneMs == null || now - it.doneMs <= SETTINGS.doneDays * 24 * HOUR) out.done.push(v);
      } else if (applies) out.answered.push(v);
      else if (it.owner === self) out.mine.push(v);
      else out.others.push(v);
    }
    out.mine.sort(byUrgency);
    out.others.sort(byUrgency);
    out.answered.sort((a, b) => (ms(b.ans.answered_at) || 0) - (ms(a.ans.answered_at) || 0));
    out.done.sort((a, b) => (b.it.doneMs || 0) - (a.it.doneMs || 0));
    return out;
  }
  function answerText(ans, it, toast) {
    if (!ans) return "";
    const p = toast ? "toast" : "ans";
    if (ans.kind === "choose") {
      const o = it.options.find((x) => x.key === ans.key);
      return t(p + "Choose", { key: ans.key, label: o ? o.label : "?" });
    }
    if (ans.kind === "reassign") {
      return ans.reassign_to ? t(p + "Reassign", { owner: ownerMap().get(ans.reassign_to) || ans.reassign_to }) : t(p + "Unknown");
    }
    return t(p + "Reply");
  }

  /* ===== 8. Rendering. Blocks are cached by a signature, so live updates never rebuild what you are touching. ===== */
  const cache = new Map();
  function cached(key, sig, build) {
    const hit = cache.get(key);
    if (hit && hit.sig === sig) return hit.el;
    const el = build();
    cache.set(key, { sig, el });
    return el;
  }
  function ui(id) {
    return [S.panel && S.panel.id === id ? S.panel.type : 0, S.confirm && S.confirm.id === id ? S.confirm.key : 0,
      S.busy.has(id), S.pick.get(id) || 0, S.to.has(id) ? S.to.get(id) : 0];
  }
  let ctx = "";

  function rel(kind, when) {
    const el = h("span", { "data-rel": kind, "data-ms": when });
    el.textContent = relText(kind, when, Date.now());
    return el;
  }
  function relText(kind, when, now) {
    if (kind === "wait") return t("wait", { d: dur(now - when) });
    if (kind === "due") return when >= now ? t("dueIn", { d: dur(when - now) }) : t("duePast", { d: dur(now - when) });
    if (kind === "done") return t("doneAgo", { d: dur(now - when) });
    return t("ago", { d: dur(now - when) });
  }

  function pill(v) {
    const it = v.it;
    const cls = "pill" + (v.tier === "urgent" ? " is-urgent" : v.tier === "stale" ? " is-stale" : "");
    const text = h("span");
    if (v.overdue && (it.askedMs == null || Date.now() - it.askedMs < SETTINGS.blockerHours * HOUR)) text.append(t("overdue"));
    else {
      if (it.askedMs != null) text.append(rel("wait", it.askedMs));
      if (v.tier !== "fresh") text.append(t("listSep") + t(v.tier === "urgent" ? "tierUrgent" : "tierStale"));
    }
    return h("span", { class: cls }, icon(v.tier === "urgent" ? "stop" : "clock"), text);
  }
  function stakeChip(s) {
    return h("span", { class: "stake" }, icon(s), t("stake_" + s));
  }

  function card(v, inRow) {
    const it = v.it;
    const sig = JSON.stringify([it.sig, v.ans, v.prev, v.tier, v.overdue, ui(it.id), S.readOnly, ctx, inRow]);
    return cached((inRow ? "rowcard:" : "card:") + it.id, sig, () => buildCard(v, inRow));
  }

  function buildCard(v, inRow) {
    const it = v.it;
    const el = h("article", { class: "card" + (v.urgent && !inRow ? " is-urgent" : ""), id: "card-" + it.id, "aria-labelledby": "t-" + it.id });
    el.append(h("div", { class: "card-top" },
      pill(v),
      it.stakes.map(stakeChip),
      it.demo && S.mode === "live" ? h("span", { class: "chip-demo", text: t("demoChip") }) : null,
      it.project ? h("span", { class: "proj", text: it.project }) : null));
    el.append(h("h3", { class: "card-title", id: "t-" + it.id, tabindex: "-1", text: it.title }));
    if (it.blocked) el.append(h("p", { class: "blocked" }, h("span", { class: "blocked-k", text: t(it.blocking ? "blockedLabel" : "waitingLabel") }), it.blocked));
    if (it.why) el.append(h("p", { class: "why", text: it.why }));
    if (v.prev) el.append(h("p", { class: "notice", text: t("changed", { prev: answerText(v.prev, it) }) }));
    if (inRow) el.append(h("p", { class: "notice is-subtle", text: t("othersNote", { owner: ownerMap().get(it.owner) || it.owner }) }));
    if (it.ifNo) el.append(autoLine(it));
    el.append(optionsBlock(it));
    el.append(actions(it));
    if (S.panel && S.panel.id === it.id) el.append(S.panel.type === "reply" ? replyPanel(it) : reassignPanel(it));
    el.append(meta(it, v));
    return el;
  }

  function autoLine(it) {
    const past = it.ifNo.atMs < Date.now();
    return h("p", { class: "auto" }, icon("auto"),
      h("span", { text: t(past ? "ifNoPast" : "ifNo", { t: at(it.ifNo.atMs), key: it.ifNo.key, label: it.ifNo.label }) }));
  }

  function optionsBlock(it) {
    const box = h("div", { class: "opts", role: "group", "aria-label": t("options") });
    const rec = it.recommend;
    const order = rec ? [it.options.find((o) => o.key === rec.key), ...it.options.filter((o) => o.key !== rec.key)] : it.options;
    const picked = S.confirm && S.confirm.id === it.id ? S.confirm.key : null;
    const locked = S.readOnly || S.busy.has(it.id);
    for (const o of order) {
      const isRec = !!rec && rec.key === o.key;

  // <details> keeps its own open state; we only mirror it into S.open and back, never rebuild on toggle.

  function summary(d) {
    const urgent = d.mine.filter((v) => v.urgent).length;

      if (urgent) p.append(" ", h("span", { class: "urg", text: t("summaryUrgent", { n: urgent, h: SETTINGS.blockerHours }) }));
    } else if (d.others.length) {
      p.append(t("summaryNoneMine"), " ", t("summaryOthers", { n: d.others.length }));

  function render() {
    const now = Date.now();
    const keep = captureFocus();
    ctx = JSON.stringify([lang, [...ownerMap()], selfKey()]);
    const d = derive(now);
    S.tiers = tierSig(now);

    const badge = $("badge");
    badge.hidden = S.mode === "loading" || !S.loaded;
    badge.className = "badge" + (d.mine.length ? "" : " is-clear");
    badge.replaceChildren(h("span", { class: "n", text: String(d.mine.length) }), h("span", { text: t(d.mine.length ? "badge" : "badgeClear") }));
    $("brand-sub").textContent = t("appSub");

    const blocks = [];
    if (S.fatal) blocks.push(h("p", { class: "banner is-err", role: "alert", text: S.fatal }));
    if (!S.loaded) {
      blocks.push(h("p", { class: "summary", text: t("loading") }), h("div", { class: "skel", "aria-hidden": "true" }, h("i"), h("i"), h("i")));
    } else {
      blocks.push(summary(d));
      if (S.mode === "demo") blocks.push(h("p", { class: "banner", text: t("demoBanner") }));
      else if ([...S.items.values()].some((it) => it.demo)) blocks.push(h("p", { class: "banner", text: t("exampleBanner") }));
      if (S.readOnly) blocks.push(h("p", { class: "banner", text: t("readOnly") }));

      blocks.push(h("h2", { class: "sec-h", id: "mine-h", tabindex: "-1" }, t("secMine"), h("span", { class: "n", text: String(d.mine.length) })));
      if (!d.mine.length) {
        blocks.push(h("p", { class: "empty", text: S.items.size ? t("emptyMine") : t("emptyMine") + " " + t("emptyStore") }));
      } else {
        // Stuck items first, then the batch strip, then the rest: the strip never pushes a blocker down.
        const batch = batchBlock(d.mine.filter((v) => !v.it.stakes.length && v.it.recommend));
        const urgent = d.mine.filter((v) => v.urgent);
        const rest = d.mine.filter((v) => !v.urgent);
        if (urgent.length && rest.length) blocks.push(h("p", { class: "subhead" }, icon("stop"), t("subUrgent", { h: SETTINGS.blockerHours })));
        urgent.forEach((v) => blocks.push(card(v, false)));
        if (urgent.length && rest.length) blocks.push(h("p", { class: "subhead is-rest", text: t("subRest") }));
        if (batch) blocks.push(batch);
        rest.forEach((v) => blocks.push(card(v, false)));
      }

      if (d.others.length) {
        blocks.push(h("h2", { class: "sec-h", id: "others-h", tabindex: "-1" }, t("secOthers"), h("span", { class: "n", text: String(d.others.length) })));
        const owners = [...ownerMap().keys()];
        const groups = new Map();
        for (const v of d.others) {
          if (!groups.has(v.it.owner)) groups.set(v.it.owner, []);
          groups.get(v.it.owner).push(v);
        }
        const order = (k) => { const i = owners.indexOf(k); return i < 0 ? 999 : i; };
        for (const key of [...groups.keys()].sort((a, b) => order(a) - order(b))) {
          const list = groups.get(key);
          blocks.push(h("h3", { class: "group-h" }, ownerMap().get(key) || key || "—", h("span", { class: "n", text: String(list.length) })));
          list.forEach((v) => blocks.push(row(v)));
        }
      }
      if (d.answered.length) blocks.push(answeredBlock(d.answered));
      if (d.done.length) blocks.push(doneBlock(d.done));
    }
    blocks.push(helpBlock());
    reconcile($("app"), blocks);
    restoreFocus(keep);
  }

  // Remove what is gone first, then insert new nodes around the kept ones. Kept nodes never move
  // unless their order changed, so a focused button or a half-typed note survives a live update.
  function reconcile(parent, nodes) {
    const keep = new Set(nodes);
    for (const child of [...parent.childNodes]) if (!keep.has(child)) child.remove();
    nodes.forEach((n, i) => { if (parent.childNodes[i] !== n) parent.insertBefore(n, parent.childNodes[i] || null); });
  }
  function captureFocus() {
    const a = document.activeElement;
    if (!a || a === document.body || !a.id) return null;
    return { id: a.id, s: a.selectionStart, e: a.selectionEnd };
  }
  function restoreFocus(f) {
    if (!f) return;
    const a = document.activeElement;
    if (a && a !== document.body && a.id === f.id) return;
    const el = $(f.id);
    if (!el) return;
    el.focus({ preventScroll: true });
    if (f.s != null && typeof el.setSelectionRange === "function") { try { el.setSelectionRange(f.s, f.e); } catch (_) {} }
  }
  function focus(id) { const el = $(id); if (el) el.focus({ preventScroll: true }); }

  function tierSig(now) {
    return [...S.items.values()].map((it) => it.id + ":" + tierOf(it, now).tier).join("|");
  }
  function tick() {
    const now = Date.now();
    if (tierSig(now) !== S.tiers) return render();
    document.querySelectorAll("[data-rel]").forEach((el) => { el.textContent = relText(el.dataset.rel, Number(el.dataset.ms), now); });
  }

  /* ===== 9. Answering ===== */
  function onPick(it, o) {
    if (guarded() || S.readOnly) return;
    if (it.stakes.length) {
      if (!(S.confirm && S.confirm.id === it.id && S.confirm.key === o.key)) {
        S.confirm = { id: it.id, key: o.key };
        S.panel = null;
        guard(500);
        render();
        focus("confirm-" + it.id);
      }
      return;
    }
    submit(it, { kind: "choose", key: o.key });
  }

  function nextTitleAfter(id) {
    const cards = [...document.querySelectorAll("#app > article.card")];
    const i = cards.findIndex((c) => c.id === "card-" + id);
    const next = i >= 0 ? cards[i + 1] || cards[i - 1] : null;
    return next ? next.id.replace(/^card-/, "t-") : "mine-h";
  }

  async function submit(it, part, opts = {}) {
    if (S.readOnly || S.busy.has(it.id)) return false;
    const prev = S.answers.get(it.id) || null;
    const answer = { v: 1, item_id: it.id, item_rev: it.rev, kind: part.kind, answered_at: new Date().toISOString(), answered_by: S.userId || null, via: opts.via || "card" };
    if (part.key) answer.key = part.key;
    if (part.note) answer.note = part.note;
    if (part.kind === "reassign") answer.reassign_to = part.reassign_to || null;
    const nextFocus = opts.quiet ? null : nextTitleAfter(it.id);
    S.busy.add(it.id);
    S.confirm = null;
    S.panel = null;
    S.answers.set(it.id, answer);
    guard(600);
    render();
    if (nextFocus) focus(nextFocus);
    try {
      await store.writeAnswer(it.id, answer);
      S.drafts.delete(it.id); S.rdrafts.delete(it.id); S.pick.delete(it.id); S.to.delete(it.id);
      if (!opts.quiet) toast(answerText(answer, it, true), () => undo([{ id: it.id, prev }]));
      return true;
    } catch (e) {
      if (prev) S.answers.set(it.id, prev); else S.answers.delete(it.id);
      failed(e);
      return false;
    } finally {
      S.busy.delete(it.id);
      render();
    }
  }

  async function submitBatch(list) {
    S.batchOpen = false;
    S.batchSkip.clear();
    const done = [];
    for (const v of list) {
      const prev = S.answers.get(v.it.id) || null;
      if (await submit(v.it, { kind: "choose", key: v.it.recommend.key }, { via: "batch", quiet: true })) done.push({ id: v.it.id, prev });
      else break;
    }
    if (done.length) toast(t("toastBatch", { n: done.length }), () => undo(done));
    focus("mine-h");
  }

  async function undo(entries) {
    for (const { id, prev } of entries) {
      S.busy.add(id);
      try {
        if (prev) { await store.writeAnswer(id, prev); S.answers.set(id, prev); }
        else { await store.deleteAnswer(id); S.answers.delete(id); }
      } catch (e) {
        failed(e);
        return;
      } finally {
        S.busy.delete(id);
      }
    }
    render();
    toast(t("toastUndone"));
    if (entries.length === 1) focus("t-" + entries[0].id);
  }

  function failed(e) {
    const code = e && e.code;
    if (code === "invalid_argument") { S.readOnly = true; toast(t("readOnly")); }
    else if (code === "quota_exceeded") toast(t("quota"));
    else if (code === "revoked") { S.fatal = t("revoked"); S.readOnly = true; }
    else toast(t("writeFail"));
    render();
  }

  let toastTimer = 0;
  function toast(message, onUndo) {
    const box = $("toast");
    const btn = $("toast-undo");
    $("toast-msg").textContent = message;
    btn.textContent = t("undo");
    btn.hidden = !onUndo;
    btn.onclick = onUndo ? () => { hideToast(); onUndo(); } : null;
    box.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, SETTINGS.undoSeconds * 1000);
  }
  function hideToast() { $("toast").hidden = true; $("toast-undo").onclick = null; }

  /* ===== 10. Start ===== */
  function onItems(list) {
    S.items = new Map(list.map(normalize).filter((it) => it.id).map((it) => [it.id, it]));
    S.loaded = true;
    render();
  }
  function onAnswers(list) {
    S.answers = new Map(list.filter((a) => a && str(a.item_id)).map((a) => [str(a.item_id), a]));
    render();
  }
  function onConfig(c) {
    S.config = c && typeof c === "object" ? c : { v: 1 };
    setLocale(str(S.config.locale) || SETTINGS.locale);
    render();
  }
  function onError(e) {
    const code = e && e.code;
    S.fatal = code === "revoked" ? t("revoked") : t("loadFail");
    if (code === "revoked") S.readOnly = true;
    S.loaded = true;
    render();
  }

  async function boot(saved) {
    if (saved && Array.isArray(saved.drafts)) S.drafts = new Map(saved.drafts);
    if (saved && Array.isArray(saved.open)) S.open = new Set(saved.open);
    setLocale(SETTINGS.locale);
    render();
    let db = null;
    let user = null;
    const host = window.claude;
    if (host && typeof host.use === "function") {
      try { [db, user] = await Promise.all([host.use("db"), host.use("user")]); } catch (_) { db = null; }
    }
    if (db) {
      S.mode = "live";
      store = liveStore(db);
      if (user) {
        try { S.userId = await user.id(); } catch (_) {}
        try { if ((await user.can("data.write")) === false) S.readOnly = true; } catch (_) {}
      }
    } else {
      S.mode = "demo";
      store = demoStore();
    }
    store.start({ onItems, onAnswers, onConfig, onError });
    setInterval(() => { if (!document.hidden) tick(); }, 30000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
  }

  const hot = window.claude && window.claude.hot;
  try { if (hot && typeof hot.snapshot === "function") hot.snapshot(() => ({ drafts: [...S.drafts], open: [...S.open] })); } catch (_) {}
  if (hot && typeof hot.ready === "function") hot.ready(boot);
  else boot((hot && hot.data) || {});
})();
</script>
