<title>Blocker Inbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Spline+Sans+Mono:wght@500;600&display=swap">
<style>
/* Layout: one phone-width column under a sticky tally bar. Your own decisions come first as full
   cards; everyone else's are compact rows grouped by owner; answered and finished items fold away. */
:root {
  --bg: #EEF1F5;
  --surface: #FFFFFF;
  --surface-2: #F5F7FA;
  --chip: #E6EAF0;
  --ink: #121722;
  --muted: #525C6F;
  --line: #D5DBE5;
  --line-strong: #7A8394;
  --accent: #2346C8;
  --on-accent: #FFFFFF;
  --on-accent-muted: #DCE3FF;
  --accent-soft: #E4EAFF;
  --warn: #8A4B00;
  --warn-soft: #FFF0D1;
  --alert: #B3261E;
  --alert-soft: #FDE7E4;
  --alert-line: #E3A49D;
  --ok: #1B6B3A;
  --ok-soft: #E3F3E8;
  --stake-bg: #121722;
  --stake-fg: #FFFFFF;
  --focus: #2346C8;
  --shadow: 0 10px 28px rgb(16 22 34 / 0.22);

  --font-ui: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
  --font-mono: "Spline Sans Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --fs-xs: 0.75rem;
  --fs-s: 0.8125rem;
  --fs-m: 0.9375rem;
  --fs-l: 1.0625rem;
  --r-card: 14px;
  --r-ctl: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1117; --surface: #161B24; --surface-2: #1C2230; --chip: #252C3A;
    --ink: #E6E9EF; --muted: #A1ABBD; --line: #2A3242; --line-strong: #66728C;
    --accent: #9DB4FF; --on-accent: #0B1020; --on-accent-muted: #26324F; --accent-soft: #1E2A4A;
    --warn: #F5B961; --warn-soft: #382A12;
    --alert: #FF8E85; --alert-soft: #3B1815; --alert-line: #7A3A33;
    --ok: #7DD8A0; --ok-soft: #13301F;
    --stake-bg: #E6E9EF; --stake-fg: #121722;
    --focus: #9DB4FF;
    --shadow: 0 10px 28px rgb(0 0 0 / 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1117; --surface: #161B24; --surface-2: #1C2230; --chip: #252C3A;
  --ink: #E6E9EF; --muted: #A1ABBD; --line: #2A3242; --line-strong: #66728C;
  --accent: #9DB4FF; --on-accent: #0B1020; --on-accent-muted: #26324F; --accent-soft: #1E2A4A;
  --warn: #F5B961; --warn-soft: #382A12;
  --alert: #FF8E85; --alert-soft: #3B1815; --alert-line: #7A3A33;
  --ok: #7DD8A0; --ok-soft: #13301F;
  --stake-bg: #E6E9EF; --stake-fg: #121722;
  --focus: #9DB4FF;
  --shadow: 0 10px 28px rgb(0 0 0 / 0.5);
  color-scheme: dark;
}

html { scroll-padding-top: calc(72px + env(safe-area-inset-top, 0px)); scroll-padding-bottom: 24px; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: var(--fs-m);
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}
button, input, textarea, select { font-family: inherit; }
/* Japanese: break lines between phrases, not inside them (Chromium; others fall back to normal). */
.card-title, .row-t, .summary, .opt .lbl, .rc-t, .sec-h { word-break: auto-phrase; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* Tally bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 10px; display: flex; align-items: center; gap: 12px; }
.brand { display: grid; min-width: 0; margin: 0; font-size: inherit; font-weight: inherit; }
.mark { font-family: var(--font-mono); font-weight: 600; font-size: var(--fs-m); letter-spacing: 0.01em; line-height: 1.3; }
.sub { font-size: var(--fs-xs); color: var(--muted); line-height: 1.4; }
.badge { margin-left: auto; display: inline-flex; align-items: baseline; gap: 6px; color: var(--muted); font-weight: 700; font-size: var(--fs-xs); white-space: nowrap; }
.badge .n { font-family: var(--font-mono); font-size: 1.375rem; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.badge.is-clear .n { color: var(--ok); }

/* Page column */
.wrap { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 96px; display: grid; gap: 12px; }
.wrap > * { min-width: 0; }
.summary { margin: 2px 0 0; font-size: var(--fs-l); line-height: 1.6; font-weight: 700; text-wrap: pretty; }
.summary .urg { color: var(--alert); }
.banner { margin: 0; display: grid; gap: 10px; justify-items: start; padding: 10px 12px; border-radius: 10px; font-size: var(--fs-s); background: var(--surface-2); border: 1px dashed var(--line-strong); }
.banner p { margin: 0; }
.banner.is-err { border-style: solid; border-color: var(--alert-line); background: var(--alert-soft); }

.sec-h { display: flex; align-items: baseline; gap: 8px; margin: 14px 0 0; font-size: var(--fs-m); font-weight: 700; line-height: 1.4; }
.sec-h:focus { outline: none; }
.sec-h:focus-visible, .panel-l:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; border-radius: 4px; }
.sec-h .n { font-family: var(--font-mono); font-size: var(--fs-s); color: var(--muted); font-variant-numeric: tabular-nums; }
.group-h { margin: 6px 0 -4px; display: flex; align-items: baseline; gap: 6px; font-size: var(--fs-s); font-weight: 700; color: var(--muted); line-height: 1.4; }
.group-h .n { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.empty { margin: 0; display: grid; gap: 10px; justify-items: start; padding: 14px 16px; border-radius: var(--r-card); background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: var(--fs-s); }
.empty p { margin: 0; }
.chooser { display: grid; gap: 10px; padding: 14px 16px; border-radius: var(--r-card); background: var(--surface); border: 1.5px solid var(--accent); }
.chooser p { margin: 0; font-size: var(--fs-s); }
.chooser .q { font-size: var(--fs-m); font-weight: 700; }

/* Card */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px; display: grid; gap: 10px; min-width: 0; }
.card.is-urgent { border-color: var(--alert-line); }
.card-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.card-title { margin: 0; font-size: var(--fs-l); line-height: 1.45; font-weight: 700; text-wrap: balance; overflow-wrap: anywhere; }
.card-title:focus { outline: none; }
.card-title:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; border-radius: 4px; }
.blocked, .why { margin: 0; font-size: var(--fs-s); line-height: 1.55; overflow-wrap: anywhere; }
.blocked-k { color: var(--muted); margin-right: 6px; }
.why { color: var(--muted); }
.notice { margin: 0; padding: 8px 10px; border-radius: 8px; font-size: var(--fs-s); background: var(--warn-soft); }
.notice.is-subtle { background: var(--surface-2); color: var(--muted); }
.auto { margin: 0; display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: 8px; font-size: var(--fs-s); background: var(--accent-soft); }
.auto .ic { margin-top: 3px; }

.pill { display: inline-flex; align-items: center; gap: 4px; padding: 5px 9px; border-radius: 999px; background: var(--chip); color: var(--muted); font-size: var(--fs-xs); font-weight: 700; line-height: 1.2; white-space: nowrap; }
.pill.is-stale { background: var(--warn-soft); color: var(--warn); }
.pill.is-urgent { background: var(--alert-soft); color: var(--alert); }
.pill .ic { width: 13px; height: 13px; }
.stake { display: inline-flex; align-items: center; gap: 4px; padding: 5px 8px 5px 6px; border-radius: 6px; background: var(--stake-bg); color: var(--stake-fg); font-size: var(--fs-xs); font-weight: 700; line-height: 1.2; white-space: nowrap; }
.stake .ic { width: 13px; height: 13px; }

/* Options */
.opts { display: grid; gap: 8px; }
.opt {
  all: unset; box-sizing: border-box; cursor: pointer; width: 100%; min-height: 56px;
  display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; column-gap: 12px; row-gap: 2px; align-items: center;
  padding: 12px 14px; border-radius: var(--r-ctl); border: 1.5px solid var(--line-strong);
  background: var(--surface); color: var(--ink); text-align: left;
}
.opt:hover { border-color: var(--ink); }
.opt:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.opt .k { grid-row: 1 / span 3; align-self: start; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; border: 1.5px solid currentColor; font-family: var(--font-mono); font-weight: 600; font-size: var(--fs-s); }
.opt .lbl { grid-column: 2; font-weight: 700; font-size: var(--fs-m); line-height: 1.4; overflow-wrap: anywhere; }
.opt .tag { grid-column: 3; grid-row: 1; padding: 3px 8px; border-radius: 999px; background: var(--on-accent); color: var(--accent); font-size: var(--fs-xs); font-weight: 700; line-height: 1.3; white-space: nowrap; }
.opt .cons, .opt .rsn { grid-column: 2 / 4; font-size: var(--fs-s); line-height: 1.5; overflow-wrap: anywhere; }
.opt .cons { color: var(--muted); }
.opt .rsn b { margin-right: 6px; }
.opt.is-rec { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.opt.is-rec .cons, .opt.is-rec .rsn { color: var(--on-accent-muted); }
.opt.is-rec .rsn b { color: var(--on-accent); }
.opt.is-rec.is-soft { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.opt.is-rec.is-soft .cons, .opt.is-rec.is-soft .rsn { color: var(--muted); }
.opt.is-rec.is-soft .rsn b { color: var(--ink); }
.opt.is-rec.is-soft .tag { background: var(--accent); color: var(--on-accent); }
.opt.is-picked { outline: 3px solid var(--alert); outline-offset: 2px; }
.opt:disabled { cursor: default; border-style: dashed; }
.opt.is-rec:disabled { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.opt.is-rec:disabled .cons, .opt.is-rec:disabled .rsn { color: var(--muted); }
.opt.is-rec:disabled .rsn b { color: var(--ink); }
.opt.is-rec:disabled .tag { background: var(--accent); color: var(--on-accent); }

.confirm { display: grid; gap: 10px; padding: 14px; border-radius: var(--r-ctl); background: var(--alert-soft); border: 1.5px solid var(--alert-line); }
.confirm p { margin: 0; font-size: var(--fs-s); line-height: 1.6; }
.confirm strong { color: var(--alert); }

/* Secondary actions and panels */
.acts { display: flex; flex-wrap: wrap; gap: 0 18px; margin-top: -2px; }
.link-btn { all: unset; box-sizing: border-box; cursor: pointer; min-height: 44px; display: inline-flex; align-items: center; padding: 0 2px; color: var(--accent); font-weight: 700; font-size: var(--fs-s); line-height: 1.3; }
.link-btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.link-btn[aria-expanded="true"] { text-decoration: underline; text-underline-offset: 4px; }
.link-btn:disabled { color: var(--muted); cursor: default; }
.panel { display: grid; gap: 10px; padding: 14px; border-radius: var(--r-ctl); background: var(--surface-2); border: 1px solid var(--line); }
.panel-l { margin: 0; font-size: var(--fs-s); font-weight: 700; }
.panel-l:focus { outline: none; }
.field { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 8px; border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: 16px; line-height: 1.5; }
textarea.field { resize: vertical; min-height: 84px; }
.field::placeholder { color: var(--muted); opacity: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { all: unset; box-sizing: border-box; cursor: pointer; min-height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: var(--fs-s); font-weight: 700; line-height: 1.3; }
.chip:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.chip .k { font-family: var(--font-mono); }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { all: unset; box-sizing: border-box; cursor: pointer; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; padding: 10px 18px; border-radius: var(--r-ctl); border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: var(--fs-s); font-weight: 700; line-height: 1.3; text-align: center; }
.btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.btn.is-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.is-danger { background: var(--alert); border-color: var(--alert); color: var(--surface); }
.btn:disabled { cursor: default; opacity: 0.5; }

/* Meta and evidence */
.meta { display: grid; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); font-size: var(--fs-xs); color: var(--muted); line-height: 1.5; }
.meta-line { margin: 0; display: flex; flex-wrap: wrap; gap: 2px 12px; }
.asker { font-family: var(--font-mono); }
.due.is-over { color: var(--alert); font-weight: 700; }
.evs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.evs-k { margin-right: 2px; }
.ev { display: inline-flex; align-items: center; gap: 4px; min-height: 32px; box-sizing: border-box; padding: 4px 10px; border-radius: 999px; background: var(--chip); color: var(--ink); font-size: var(--fs-xs); font-weight: 700; text-decoration: none; overflow-wrap: anywhere; }
a.ev:hover { text-decoration: underline; }
.ev .ic { width: 12px; height: 12px; }

/* Rows for other owners */
.row { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-ctl); }
.row > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 12px 14px; min-height: 48px; box-sizing: border-box; }
.row > summary::-webkit-details-marker { display: none; }
.row > summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: var(--r-ctl); }
.row-main { display: grid; gap: 6px; min-width: 0; }
.row-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.row-top .pill { background: transparent; padding-inline: 0; }
.row-t { font-weight: 700; font-size: var(--fs-m); line-height: 1.45; overflow-wrap: anywhere; }
.row-auto { font-size: var(--fs-xs); color: var(--muted); line-height: 1.5; }
.chev { width: 18px; height: 18px; color: var(--muted); }
.row[open] > summary { border-bottom: 1px solid var(--line); }
.row[open] .chev { transform: rotate(180deg); }
.row > .card { border: 0; border-radius: 0 0 var(--r-ctl) var(--r-ctl); }

/* Receipts: what you answered, kept where the card was so nothing jumps under your thumb */
.receipt { position: relative; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; padding: 12px 14px; border-radius: var(--r-ctl); background: var(--surface); border: 1px solid var(--line); }
.receipt.is-sending { border-color: var(--accent); background: var(--accent-soft); }
.rc-main { display: grid; gap: 3px; min-width: 0; }
.rc-t { font-weight: 700; font-size: var(--fs-s); line-height: 1.45; overflow-wrap: anywhere; }
.rc-a { display: flex; gap: 6px; align-items: flex-start; font-size: var(--fs-s); font-weight: 700; color: var(--ok); line-height: 1.45; overflow-wrap: anywhere; }
.rc-a .ic { margin-top: 2px; }
.is-sending .rc-a { color: var(--ink); }
.rc-s { font-size: var(--fs-xs); color: var(--muted); line-height: 1.5; }
.rc-s.is-stale { color: var(--warn); font-weight: 700; }
.rc-n { font-size: var(--fs-xs); color: var(--muted); line-height: 1.5; overflow-wrap: anywhere; }
.rc-bar { position: absolute; left: 0; bottom: 0; width: 100%; height: 3px; background: var(--accent); transform-origin: left center; }
.receipt > .panel { grid-column: 1 / -1; }
.receipt:not(.is-sending) { grid-template-columns: minmax(0, 1fr); }
.receipt:not(.is-sending) > .btn { justify-self: start; }

/* Folded section */
.fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; min-height: 44px; font-size: var(--fs-m); font-weight: 700; }
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary .n { font-family: var(--font-mono); font-size: var(--fs-s); color: var(--muted); }
.fold[open] .chev { transform: rotate(180deg); }
.fold-list { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 8px; }

/* Help */
.help { margin-top: 18px; border-top: 1px solid var(--line); font-size: var(--fs-s); color: var(--muted); }
.help > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; min-height: 48px; color: var(--ink); font-weight: 700; }
.help > summary::-webkit-details-marker { display: none; }
.help[open] .chev { transform: rotate(180deg); }
.help-body { display: grid; gap: 12px; padding-bottom: 8px; }
.help-body p { margin: 0; line-height: 1.65; }
.help-body ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.help-body li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.help-body a { color: var(--accent); font-weight: 700; }
.help-self { display: grid; gap: 6px; }
.help-self label { color: var(--ink); font-weight: 700; }
.help-self select { justify-self: start; max-width: 100%; padding: 8px 10px; border-radius: 8px; border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: 16px; }

/* Loading */
.skel { display: grid; gap: 10px; padding: 16px; border-radius: var(--r-card); background: var(--surface); border: 1px solid var(--line); }
.skel i { display: block; height: 12px; border-radius: 6px; background: var(--chip); }
.skel i:nth-child(1) { width: 40%; } .skel i:nth-child(2) { width: 85%; height: 16px; } .skel i:nth-child(3) { width: 65%; }

/* Alert for failures: stays until closed. Undo lives on the receipt, not here. */
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 10; max-width: 560px; margin-inline: auto; display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 16px; border-radius: 12px; background: var(--ink); color: var(--surface); box-shadow: var(--shadow); }
.toast-msg { flex: 1; min-width: 0; font-size: var(--fs-s); font-weight: 700; line-height: 1.5; overflow-wrap: anywhere; }
.toast .btn { background: transparent; border-color: var(--muted); color: var(--surface); }

@media (prefers-reduced-motion: no-preference) {
  .chev { transition: transform 0.15s ease; }
  .rc-bar { animation: drain linear forwards; }
  @keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }
  .toast:not([hidden]) { animation: toast-in 0.18s ease-out; }
  @keyframes toast-in { from { transform: translateY(8px); opacity: 0.4; } to { transform: none; opacity: 1; } }
}
@media (prefers-reduced-motion: reduce) { .rc-bar { display: none; } }
</style>

    it.askedMs = ms(raw.asked_at);
    it.dueMs = ms(raw.due);
    it.doneMs = ms(raw.done_at);
    it.outcome = str(raw.outcome);
    const rec = raw.received;
    it.received = rec && typeof rec === "object" && ms(rec.answered_at) != null && (rec.item_rev == null || Number(rec.item_rev) === it.rev) ? rec : null;
    return it;
  }

  function ownerMap() {
    const map = new Map();
    const cfg = src().config;
    for (const o of cfg && Array.isArray(cfg.owners) ? cfg.owners : []) {
      if (o && str(o.key)) map.set(str(o.key), str(o.label) || str(o.key));
    }
    for (const it of src().items.values()) if (it.owner && !it.selfOwned && !map.has(it.owner)) map.set(it.owner, it.owner);
    return map;
  }
  const ownerLabel = (k) => (k ? ownerMap().get(k) || k : t("ownerNone"));

  // "Yours" comes from config/inbox only for the artifact's owner (and in demo); everyone else picks once.
  function selfKey() {
    const saved = local.get("self:" + S.view);
    if (saved) return saved;
    const cfg = src().config;
    if ((S.isOwner || S.view === "demo") && cfg && str(cfg.self)) return str(cfg.self);
    return null;
  }

  /* ===== 7. Deriving the view ===== */
  function tierOf(it, now) {
    const age = it.askedMs == null ? 0 : now - it.askedMs;
    const overdue = it.status === "open" && it.dueMs != null && it.dueMs < now;
    const urgent = age >= SETTINGS.blockerHours * HOUR || overdue;
    const stale = !urgent && age >= SETTINGS.staleHours * HOUR;
    return { overdue, urgent, tier: urgent ? "urgent" : stale ? "stale" : "fresh" };
  }
  function byUrgency(a, b) {
    return (a.urgent === b.urgent ? 0 : a.urgent ? -1 : 1)
      || (a.it.blocking === b.it.blocking ? 0 : a.it.blocking ? -1 : 1)
      || ((a.it.dueMs ?? Infinity) - (b.it.dueMs ?? Infinity))
      || ((a.it.askedMs ?? 0) - (b.it.askedMs ?? 0))
      || a.it.id.localeCompare(b.it.id);
  }
  function derive(now) {
    const self = selfKey();
    const out = { self, mine: [], others: [], closed: [], mineOpen: 0, urgentOpen: 0, othersOpen: 0 };
    for (const it of src().items.values()) {
      const ans = src().answers.get(it.id) || null;
      const applies = !!ans && (Number(ans.item_rev) || 1) === it.rev;
      const v = { it, ans: applies ? ans : null, prev: ans && !applies ? ans : null, pend: S.pending.get(it.id) || null, ...tierOf(it, now) };
      v.open = !v.pend && !v.ans && it.status === "open";
      if (it.status === "done") {
        const doneAt = it.doneMs ?? ms(it.received && it.received.received_at) ?? it.askedMs ?? now;
        if (now - doneAt <= SETTINGS.doneDays * 24 * HOUR) out.closed.push(v);
        continue;
      }
      if (S.pinned.has(it.id) || (v.ans && !v.pend && !S.recent.has(it.id))) { out.closed.push(v); continue; }
      const mine = !!self && !it.selfOwned && it.owner === self;
      (mine ? out.mine : out.others).push(v);
      if (v.open) { if (mine) { out.mineOpen++; if (v.urgent) out.urgentOpen++; } else out.othersOpen++; }
    }
    out.mine.sort(byUrgency);
    out.others.sort(byUrgency);
    const closedAt = (v) => v.it.doneMs || ms(v.ans && v.ans.answered_at) || 0;
    out.closed.sort((a, b) => closedAt(b) - closedAt(a));
    return out;
  }

  function answerLine(ans, it, phase) {
    if (!ans) return "";
    if (ans.kind === "choose") {
      const o = it.options.find((x) => x.key === ans.key);
      return t(phase + "Choose", { key: ans.key, label: o ? o.label : "?" });
    }
    if (ans.kind === "reassign") return ans.reassign_to ? t(phase + "Reassign", { owner: ownerLabel(ans.reassign_to) }) : t(phase + "Unknown");
    return t(phase + "Reply");
  }
  function answerWhat(ans, it) {
    // Short form for notices: "A（label）", or the sent line for other kinds.
    if (ans && ans.kind === "choose") { const o = it.options.find((x) => x.key === ans.key); return ans.key + (o ? (lang === "ja" ? "（" + o.label + "）" : " (" + o.label + ")") : ""); }
    return answerLine(ans, it, "sent");
  }

  /* ===== 8. Rendering. Blocks are cached by a signature, so a live update never rebuilds what you touch. ===== */
  const cache = new Map();
  function cached(key, sig, build) {
    const hit = cache.get(key);
    if (hit && hit.sig === sig) return hit.el;
    const el = build();
    cache.set(key, { sig, el });
    return el;
  }
  function ui(id) {
    return [S.panel && S.panel.id === id ? S.panel.type : 0, S.confirm && S.confirm.id === id ? S.confirm.key : 0,
      S.pick.get(id) || 0, S.to.has(id) ? S.to.get(id) : 0, S.reopen.has(id), S.sending.has(id)];
  }
  let ctx = "";

  function rel(kind, when) {
    const el = h("span", { "data-rel": kind, "data-ms": when });
    el.textContent = relText(kind, when, Date.now());
    return el;
  }
  function relText(kind, when, now) {
    if (kind === "wait") return t("wait", { d: dur(now - when) });
    if (kind === "due") return when >= now ? t("dueIn", { d: dur(when - now) }) : t("duePast", { d: dur(now - when) });
    return ago(now - when);
  }

  function pill(v) {
    const it = v.it;
    const text = h("span");
    if (v.overdue && (it.askedMs == null || Date.now() - it.askedMs < SETTINGS.blockerHours * HOUR)) text.append(t("overdue"));
    else {
      if (it.askedMs != null) text.append(rel("wait", it.askedMs));
      if (v.tier !== "fresh") text.append(t("listSep") + t(v.tier === "urgent" ? "tierUrgent" : "tierStale"));
    }
    return h("span", { class: "pill" + (v.tier === "urgent" ? " is-urgent" : v.tier === "stale" ? " is-stale" : "") },
      icon(v.tier === "urgent" ? "stop" : "clock"), text);
  }
  function stakeChips(it) {
    return [
      ...it.stakes.map((s) => h("span", { class: "stake" }, icon(s), t("stake_" + s))),
      ...it.otherStakes.map((s) => h("span", { class: "stake" }, icon("other"), t("stake_other", { v: s }))),
    ];
  }
  function stakeNames(it) {
    return [...it.stakes.map((s) => t("stake_" + s)), ...it.otherStakes.map((s) => t("stake_other", { v: s }))];
  }

  function card(v, inRow) {
    const it = v.it;
    const sig = JSON.stringify([it.sig, v.ans, v.prev, v.tier, v.overdue, ui(it.id), S.readOnly, ctx, inRow]);
    return cached((inRow ? "rowcard:" : "card:") + it.id, sig, () => buildCard(v, inRow));
  }

  function buildCard(v, inRow) {
    const it = v.it;
    const reopened = S.reopen.has(it.id) && v.ans;
    const el = h("article", { class: "card" + (v.urgent && !inRow && !reopened ? " is-urgent" : ""), id: "card-" + it.id, "aria-labelledby": "t-" + it.id });
    el.append(h("div", { class: "card-top" }, pill(v), stakeChips(it)));
    el.append(h("h3", { class: "card-title", id: "t-" + it.id, tabindex: "-1", text: it.title }));
    if (it.blocked) el.append(h("p", { class: "blocked" }, h("span", { class: "blocked-k", text: t(it.blocking ? "blockedLabel" : "waitingLabel") }), " ", it.blocked));
    if (it.why) el.append(h("p", { class: "why", text: it.why }));
    if (reopened) el.append(h("p", { class: "notice is-subtle", text: t("current", { what: answerWhat(v.ans, it) }) }));
    else if (v.prev) el.append(h("p", { class: "notice", text: t("changed", { what: answerWhat(v.prev, it) }) }));
    if (inRow) el.append(h("p", { class: "notice is-subtle", text: t("othersNote", { owner: ownerLabel(it.owner) }) }));
    if (it.selfOwned && it.recommend) el.append(autoLine(it));
    el.append(optionsBlock(it));
    el.append(actions(it, reopened));
    if (S.panel && S.panel.id === it.id && (S.panel.type === "reply" || S.panel.type === "reassign")) el.append(S.panel.type === "reply" ? replyPanel(it) : reassignPanel(it));
    el.append(meta(it, v));
    return el;
  }

  function autoLine(it) {
    const r = it.recommend;
    const text = it.dueMs != null ? t("agentDue", { t: at(it.dueMs), key: r.key, label: r.label }) : t("agentPlan", { key: r.key, label: r.label });
    return h("p", { class: "auto" }, icon("auto"), h("span", { text }));
  }

  function optionsBlock(it) {
    const box = h("div", { class: "opts", role: "group", "aria-label": t("options") });
    const rec = it.recommend;
    const order = rec ? [it.options.find((o) => o.key === rec.key), ...it.options.filter((o) => o.key !== rec.key)] : it.options;
    const picked = S.confirm && S.confirm.id === it.id ? S.confirm.key : null;
    const locked = S.readOnly || S.sending.has(it.id);
    for (const o of order) {
      const isRec = !!rec && rec.key === o.key;
      box.append(h("button", {
        type: "button",
        class: "opt" + (isRec ? " is-rec" : "") + (isRec && it.marked ? " is-soft" : "") + (picked === o.key ? " is-picked" : ""),
        id: "opt-" + it.id + "-" + o.key,
        disabled: locked,
        "aria-pressed": picked ? String(picked === o.key) : null,
        onclick: () => onPick(it, o),
      },
        h("span", { class: "k", text: o.key }),
        h("span", { class: "lbl", text: o.label }),
        isRec ? h("span", { class: "tag", text: t("recommend") }) : null,
        o.consequence ? h("span", { class: "cons", text: o.consequence }) : null,
        isRec && rec.reason ? h("span", { class: "rsn" }, h("b", { text: t("reason") }), " ", rec.reason) : null));
    }
    if (picked) box.append(confirmRow(it, picked));
    return box;
  }

  function confirmRow(it, key) {
    const o = it.options.find((x) => x.key === key) || { label: "", consequence: "" };
    const stakes = stakeNames(it).map(quote).join(lang === "ja" ? "" : t("listSep"));
    return h("div", { class: "confirm", role: "group", "aria-labelledby": "cq-" + it.id },
      h("p", { id: "cq-" + it.id },
        h("strong", { text: t("confirmLead", { stakes }) }), " ",
        o.consequence ? t("confirmIf", { key, label: o.label, cons: o.consequence }) + " " : "",
        t("confirmQ")),
      h("div", { class: "row-btns" },
        h("button", { type: "button", class: "btn is-danger", id: "confirm-" + it.id, onclick: () => answer(it, { kind: "choose", key }) }, t("confirmYes")),
        h("button", { type: "button", class: "btn", id: "cancel-" + it.id, onclick: () => { S.confirm = null; render(); focus("opt-" + it.id + "-" + key); } }, t("cancel"))));
  }

  function actions(it, reopened) {
    const open = S.panel && S.panel.id === it.id ? S.panel.type : null;
    return h("div", { class: "acts" },
      h("button", { type: "button", class: "link-btn", id: "act-reply-" + it.id, disabled: S.readOnly, "aria-expanded": String(open === "reply"),
        onclick: () => togglePanel(it, "reply") }, t("actReply")),
      h("button", { type: "button", class: "link-btn", id: "act-reassign-" + it.id, disabled: S.readOnly, "aria-expanded": String(open === "reassign"),
        onclick: () => togglePanel(it, "reassign") }, t("actReassign")),
      reopened ? h("button", { type: "button", class: "link-btn", id: "act-close-" + it.id,
        onclick: () => { S.reopen.delete(it.id); S.confirm = null; S.panel = null; render(); focus("rowbtn-" + it.id); } }, t("close")) : null);
  }

  function togglePanel(it, type) {
    const same = S.panel && S.panel.id === it.id && S.panel.type === type;
    S.panel = same ? null : { id: it.id, type };
    S.confirm = null;
    render();
    if (!same) {
      const first = type === "reassign" ? document.querySelector("#card-" + CSS.escape(it.id) + " .chips .chip") : null;
      if (first) first.focus({ preventScroll: true }); else focus("note-" + it.id);
    }
  }

  function noteBox(id, placeholder) {
    const ta = h("textarea", { class: "field", id: "note-" + id, rows: "3", maxlength: "1000", placeholder,
      oninput: (e) => { S.drafts.set(id, e.target.value); if (ta.onsync) ta.onsync(); } });
    ta.value = S.drafts.get(id) || "";
    return ta;
  }

  function replyPanel(it) {
    const id = it.id;
    const ta = noteBox(id, t("notePlaceholder"));
    const send = h("button", { type: "button", class: "btn is-primary", id: "send-" + id, onclick: () => {
      const note = ta.value.trim();
      const key = S.pick.get(id);
      if (key) answer(it, { kind: "choose", key, note: note || undefined });
      else if (note) answer(it, { kind: "reply", note });
    } }, t("send"));
    ta.onsync = () => { send.disabled = !(ta.value.trim() || S.pick.get(id)); };
    ta.onsync();
    const chips = it.options.length ? h("div", { class: "chips", role: "group", "aria-labelledby": "pl-" + id },
      it.options.map((o) => h("button", { type: "button", class: "chip", id: "pick-" + id + "-" + o.key,
        "aria-pressed": String(S.pick.get(id) === o.key),
        onclick: () => { if (S.pick.get(id) === o.key) S.pick.delete(id); else S.pick.set(id, o.key); render(); } },
        S.pick.get(id) === o.key ? icon("check") : null, h("span", { class: "k", text: o.key }), " ", o.label))) : null;
    return h("div", { class: "panel" },
      h("label", { class: "panel-l", for: "note-" + id, text: t("noteLabel") }),
      ta,
      chips ? h("p", { class: "panel-l", id: "pl-" + id, text: t("pickOptional") }) : null,
      chips,
      h("div", { class: "row-btns" }, send,
        h("button", { type: "button", class: "btn", onclick: () => { S.panel = null; render(); focus("act-reply-" + id); } }, t("cancel"))));
  }

  function reassignPanel(it) {
    const id = it.id;
    const choices = [...ownerMap()].filter(([k]) => k !== it.owner).map(([k, label]) => ({ k, label }));
    choices.push({ k: "", label: t("unknownOwner") });
    const chosen = S.to.has(id) ? S.to.get(id) : null;
    const note = h("input", { class: "field", type: "text", id: "rnote-" + id, maxlength: "300", placeholder: t("reassignNote"),
      "aria-label": t("reassignNote"), oninput: (e) => S.rdrafts.set(id, e.target.value) });
    note.value = S.rdrafts.get(id) || "";
    return h("div", { class: "panel" },
      h("p", { class: "panel-l", id: "rq-" + id, tabindex: "-1", text: t("reassignQ") }),
      h("div", { class: "chips", role: "group", "aria-labelledby": "rq-" + id },
        choices.map((c) => h("button", { type: "button", class: "chip", id: "to-" + id + "-" + (c.k || "unknown"),
          "aria-pressed": String(chosen === c.k), onclick: () => { S.to.set(id, c.k); render(); } }, chosen === c.k ? icon("check") : null, c.label))),
      note,
      h("p", { class: "rc-n", text: t("reassignHint") }),
      h("div", { class: "row-btns" },
        h("button", { type: "button", class: "btn is-primary", id: "rsend-" + id, disabled: chosen == null, onclick: () => {
          answer(it, { kind: "reassign", reassign_to: chosen || null, note: str(note.value) || undefined });
        } }, t("reassignSend")),
        h("button", { type: "button", class: "btn", onclick: () => { S.panel = null; render(); focus("act-reassign-" + id); } }, t("cancel"))));
  }

  function meta(it, v) {
    const parts = [];
    if (it.asker) parts.push(h("span", { class: "asker", text: t("asker", { name: it.asker }) }));
    if (it.project) parts.push(h("span", { text: it.project }));
    if (it.dueMs != null) parts.push(h("span", { class: "due" + (v.overdue ? " is-over" : "") }, rel("due", it.dueMs), t("paren", { v: at(it.dueMs) })));
    const evs = it.evidence.length ? h("div", { class: "evs" }, h("span", { class: "evs-k", text: t("evidence") }),
      it.evidence.map((l) => isWebLink(l.url)
        ? h("a", { class: "ev", href: l.url, target: "_blank", rel: "noopener noreferrer" }, l.label, icon("link"), h("span", { class: "sr", text: t("newTab") }))
        : h("span", { class: "ev", text: l.label }))) : null;
    return h("div", { class: "meta" }, parts.length ? h("p", { class: "meta-line" }, parts) : null, evs);
  }

  // Other owners' open items: a compact row that opens into the full card.
  function othersRow(v) {
    const it = v.it;
    const id = it.id;
    const sig = JSON.stringify([it.sig, v.prev, v.tier, v.overdue, ctx]);
    const el = cached("row:" + id, sig, () => {
      const det = h("details", { class: "row", id: "row-" + id });
      det.addEventListener("toggle", () => { if (det.open) S.open.add(id); else S.open.delete(id); render(); });
      det.append(h("summary", null,
        h("span", { class: "row-main" },
          h("span", { class: "row-top" }, pill(v), stakeChips(it)),
          h("span", { class: "row-t", text: it.title }),
          it.selfOwned && it.recommend ? h("span", { class: "row-auto", text: autoLine(it).textContent }) : null),
        h("span", { class: "chev" }, icon("chev"))));
      return det;
    });
    if (el.open !== S.open.has(id)) el.open = S.open.has(id);
    const body = S.open.has(id) ? card(v, true) : null;
    const current = el.querySelector(":scope > article");
    if (body !== current) { if (current) current.remove(); if (body) el.append(body); }
    return el;
  }

  // The answer you just tapped, before it is sent: one row with Undo, where the card was.
  function sendingRow(v) {
    const it = v.it;
    const p = v.pend;
    const writing = S.sending.has(it.id);
    const sig = JSON.stringify(["snd", it.sig, p.until, writing, ctx]);
    return cached("snd:" + it.id, sig, () => h("div", { class: "receipt is-sending", id: "rc-" + it.id },
      h("div", { class: "rc-main" },
        h("span", { class: "rc-t", text: it.title }),
        h("span", { class: "rc-a", id: "rca-" + it.id }, icon("send"), answerLine(p.answer, it, "sending")),
        h("span", { class: "rc-s", "data-until": writing ? null : p.until, text: writing ? t("sendingNow") : t("sendIn", { n: secondsLeft(p.until) }) })),
      writing ? null : h("button", { type: "button", class: "btn is-primary", id: "rowbtn-" + it.id, "aria-describedby": "rca-" + it.id, onclick: () => takeBack(it.id) }, t("undo")),
      writing ? null : h("i", { class: "rc-bar", style: "animation-duration:" + Math.max(0, p.until - Date.now()) + "ms" })));
  }

  // A sent answer: what you said, whether the agent picked it up, and what you can still do.
  function receiptRow(v, inFold) {
    const it = v.it;
    const id = it.id;
    if (S.reopen.has(id) && v.ans && it.status === "open") return card(v, false);
    const notePanel = S.panel && S.panel.id === id && S.panel.type === "note";
    const sig = JSON.stringify(["rc", it.sig, v.ans, notePanel, S.readOnly, ctx, !!inFold]);
    return cached("rc:" + id, sig, () => {
      const rec = it.received;
      const base = rec || v.ans;
      const followUp = !!(rec && v.ans && str(v.ans.answered_at) !== str(rec.answered_at));
      const takenMs = rec ? ms(rec.received_at) : null;
      const sentMs = v.ans ? ms(v.ans.answered_at) : null;
      let status;
      let stale = false;
      if (it.status === "done") status = it.outcome ? t("doneLine", { outcome: it.outcome }) : t("doneBare");
      else if (followUp) status = t("followUp");
      else if (rec) {
        stale = takenMs != null && Date.now() - takenMs >= SETTINGS.staleHours * HOUR;
        status = stale ? t("pickedStale", { d: dur(Date.now() - takenMs) }) : t("picked");
      }
      else if (sentMs != null) {
        stale = Date.now() - sentMs >= SETTINGS.staleHours * HOUR;
        status = stale ? t("notPickedStale", { d: dur(Date.now() - sentMs) }) : t("notPicked", { d: ago(Date.now() - sentMs) });
      }
      let action = null;
      if (it.status === "open" && !S.readOnly) {
        action = rec
          ? h("button", { type: "button", class: "btn", id: "rowbtn-" + id, "aria-expanded": String(notePanel),
              onclick: () => { S.panel = notePanel ? null : { id, type: "note" }; render(); if (!notePanel) focus("note-" + id); } }, t("addNote"))
          : h("button", { type: "button", class: "btn", id: "rowbtn-" + id,
              onclick: () => { S.reopen.add(id); if (inFold) S.pinned.add(id); S.panel = null; S.confirm = null; render(); focus("t-" + id); } }, t("change"));
      }
      const el = h("div", { class: "receipt", id: "rc-" + id },
        h("div", { class: "rc-main" },
          h("span", { class: "rc-t", text: it.title }),
          base ? h("span", { class: "rc-a" }, icon("check"), answerLine(base, it, "sent")) : null,
          base && base.note ? h("span", { class: "rc-n", text: base.note }) : null,
          followUp ? h("span", { class: "rc-n", text: answerLine(v.ans, it, "sent") + (v.ans.note ? ": " + v.ans.note : "") }) : null,
          status ? h("span", { class: "rc-s" + (stale ? " is-stale" : ""), text: status }) : null),
        action);
      if (notePanel) {
        const ta = noteBox(id, t("notePlaceholder"));
        const send = h("button", { type: "button", class: "btn is-primary", id: "send-" + id,
          onclick: () => { const note = ta.value.trim(); if (note) answer(it, { kind: "reply", note }); } }, t("send"));
        ta.onsync = () => { send.disabled = !ta.value.trim(); };
        ta.onsync();
        el.append(h("div", { class: "panel" },
          h("label", { class: "panel-l", for: "note-" + id, text: t("noteLabel") }), ta,
          h("div", { class: "row-btns" }, send,
            h("button", { type: "button", class: "btn", onclick: () => { S.panel = null; render(); focus("rowbtn-" + id); } }, t("cancel")))));
      }
      return el;
    });
  }

  function entry(v, inOthers) {
    if (v.pend) return sendingRow(v);
    if (v.ans) return receiptRow(v);
    return inOthers ? othersRow(v) : card(v, false);
  }

  // <details> keeps its own open state; we mirror it into S.open and back, never rebuild on toggle.
  function syncOpen(el, key) {
    if (!el.dataset.bound) {
      el.dataset.bound = "1";
      el.addEventListener("toggle", () => { if (el.open) S.open.add(key); else S.open.delete(key); });
    }
    if (el.open !== S.open.has(key)) el.open = S.open.has(key);
    return el;
  }

  function closedBlock(list) {
    const el = syncOpen(cached("closed", JSON.stringify([list.length, ctx]), () =>
      h("details", { class: "fold", id: "fold-closed" },
        h("summary", null, h("span", { text: t("secClosed") }), h("span", { class: "n", text: String(list.length) }), h("span", { class: "chev" }, icon("chev"))),
        h("ul", { class: "fold-list" }))), "fold:closed");
    reconcile(el.querySelector(".fold-list"), list.map((v) => {
      const li = cached("li:" + v.it.id, "li", () => h("li"));
      reconcile(li, [v.pend ? sendingRow(v) : receiptRow(v, true)]);
      return li;
    }));
    return el;
  }

  function chooser() {
    const owners = [...ownerMap()];
    return h("div", { class: "chooser", id: "chooser" },
      h("p", { class: "q", text: t("whoQ") }),
      h("div", { class: "chips" }, owners.map(([k, label]) => h("button", { type: "button", class: "chip", id: "who-" + k,
        onclick: () => { local.set("self:" + S.view, k); render(); focus("mine-h"); } }, label))),
      h("p", { text: t("whoHint") }));
  }

  function helpBlock() {
    const owners = ownerMap();
    const self = selfKey();
    if (self && !owners.has(self)) owners.set(self, self);
    const sig = JSON.stringify([[...owners], self, ctx, S.mode]);
    return syncOpen(cached("help", sig, () => {
      const el = h("details", { class: "help", id: "help" });
      const select = h("select", { id: "self-select", onchange: (e) => { local.set("self:" + S.view, e.target.value || null); render(); } },
        self ? null : h("option", { value: "", text: "—" }),
        [...owners].map(([k, label]) => h("option", { value: k, text: label })));
      select.value = self || "";
      el.append(
        h("summary", null, h("span", { text: t("helpTitle") }), h("span", { class: "chev" }, icon("chev"))),
        h("div", { class: "help-body" },
          h("p", { text: t("helpTime", { s: SETTINGS.staleHours, b: SETTINGS.blockerHours }) }),
          h("p", { text: t("helpAnswer", { u: SETTINGS.undoSeconds }) }),
          h("p", { text: t("helpPickup") }),
          h("div", null, h("p", { class: "panel-l", text: t("helpStakes") }),
            h("ul", null,
              STAKES.map((s) => h("li", null, h("span", { class: "stake" }, icon(s), t("stake_" + s)), h("span", { text: t("stakeHelp_" + s) }))),
              h("li", null, h("span", { class: "stake" }, icon("other"), t("stake_other", { v: "…" })), h("span", { text: t("stakeHelp_other") })))),
          h("div", { class: "help-self" }, h("label", { for: "self-select", text: t("helpSelf") }), select, h("span", { text: t("helpSelfHint") })),
          h("p", { text: t("helpStore") }),
          S.mode === "live" && S.view === "live" ? h("p", null, h("button", { type: "button", class: "btn", id: "help-demo", onclick: () => showDemo(true) }, t("showDemo"))) : null,
          h("p", null, h("a", { href: SETTINGS.repoUrl, target: "_blank", rel: "noopener noreferrer", text: t("helpRepo") }))));
      return el;
    }), "fold:help");
  }

  function summary(d) {
    const p = h("p", { class: "summary" });
    if (d.mineOpen) {
      p.append(t("summaryMine", { n: d.mineOpen }));
      if (d.urgentOpen) p.append(" ", h("span", { class: "urg", text: t("summaryUrgent", { n: d.urgentOpen, h: SETTINGS.blockerHours }) }));
    } else if (d.othersOpen) {
      p.append(t("summaryNoneMine"), " ", t("summaryOthers", { n: d.othersOpen }));
    } else {
      p.append(t("summaryNothing"));
    }
    return p;
  }

  function banners() {
    const out = [];
    if (S.fatal) out.push(h("div", { class: "banner is-err", role: "alert" }, h("p", { text: S.fatal })));
    if (S.mode === "demo") out.push(h("div", { class: "banner" }, h("p", { text: t("demoBanner") })));
    if (S.mode === "live" && S.view === "demo") out.push(h("div", { class: "banner" }, h("p", { text: t("demoInLive") }),
      h("button", { type: "button", class: "btn", id: "back-live", onclick: () => showDemo(false) }, t("backToLive"))));
    if (S.mode === "live" && S.view === "live" && data.live.configSeen && !data.live.config) out.push(h("div", { class: "banner" }, h("p", { text: t("noConfig") })));
    if (S.readOnly && S.view === "live") out.push(h("div", { class: "banner" }, h("p", { text: t("readOnly") })));
    return out;
  }

  function render() {
    const now = Date.now();
    const keep = captureFocus();
    ctx = JSON.stringify([lang, [...ownerMap()], selfKey(), S.view, S.mode]);
    const d = derive(now);
    S.tiers = tierSig(now);
    const ready = S.mode !== "loading" && src().loaded;

    const badge = $("badge");
    badge.hidden = !ready;
    badge.className = "badge" + (d.mineOpen ? "" : " is-clear");
    badge.replaceChildren(h("span", { class: "n", text: String(d.mineOpen) }), h("span", { text: t(d.mineOpen ? "badge" : "badgeClear") }));
    $("brand-sub").textContent = t("appSub");

    const blocks = [];
    if (S.mode === "offline") {
      blocks.push(h("div", { class: "banner is-err", role: "alert" }, h("p", { text: t("offline") }),
        S.view === "demo" ? h("p", { text: t("demoInLive") })
          : h("button", { type: "button", class: "btn", id: "offline-demo", onclick: () => showDemo(true) }, t("showDemo"))));
      if (S.view !== "demo") { blocks.push(helpBlock()); reconcile($("app"), blocks); restoreFocus(keep); return; }
    }
    if (!ready) {
      blocks.push(h("p", { class: "summary", text: t("loading") }), h("div", { class: "skel", "aria-hidden": "true" }, h("i"), h("i"), h("i")));
    } else {
      blocks.push(summary(d), ...banners());
      if (!d.self && ownerMap().size) blocks.push(chooser());
      else {
        blocks.push(h("h2", { class: "sec-h", id: "mine-h", tabindex: "-1" }, t("secMine")));
        if (!d.mine.length) {
          const emptyStore = !src().items.size && S.view === "live";
          blocks.push(h("div", { class: "empty" }, h("p", { text: emptyStore ? t("emptyMine") + " " + t("emptyStore") : t("emptyMine") }),
            emptyStore && S.mode === "live" ? h("button", { type: "button", class: "btn", id: "empty-demo", onclick: () => showDemo(true) }, t("showDemo")) : null));
        } else {
          d.mine.forEach((v) => blocks.push(entry(v, false)));
        }
      }
      if (d.others.length) {
        blocks.push(h("h2", { class: "sec-h", id: "others-h", tabindex: "-1" }, t("secOthers"), h("span", { class: "n", text: String(d.othersOpen) })));
        const order = [...ownerMap().keys()];
        const groups = new Map();
        for (const v of d.others) {
          const key = v.it.selfOwned ? "\u0000agent" : v.it.owner || "\u0000none";
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(v);
        }
        const rank = (k) => (k === "\u0000agent" ? 1e6 : k === "\u0000none" ? 1e6 + 1 : order.indexOf(k) < 0 ? 1e5 : order.indexOf(k));
        for (const key of [...groups.keys()].sort((a, b) => rank(a) - rank(b))) {
          const list = groups.get(key);
          const label = key === "\u0000agent" ? t("groupAgent") : key === "\u0000none" ? t("ownerNone") : ownerLabel(key);
          blocks.push(h("h3", { class: "group-h" }, label, h("span", { class: "n", text: String(list.filter((v) => v.open).length) })));
          list.forEach((v) => blocks.push(entry(v, true)));
        }
      }
      if (d.closed.length) blocks.push(closedBlock(d.closed));
    }
    blocks.push(helpBlock());
    reconcile($("app"), blocks);
    restoreFocus(keep);
  }

  // Remove what is gone first, then insert new nodes around the kept ones. Kept nodes never move
  // unless their order changed, so a focused button or a half-typed note survives a live update.
  function reconcile(parent, nodes) {
    const keep = new Set(nodes);
    for (const child of [...parent.childNodes]) if (!keep.has(child)) child.remove();
    nodes.forEach((n, i) => { if (parent.childNodes[i] !== n) parent.insertBefore(n, parent.childNodes[i] || null); });
  }
  function captureFocus() {
    const a = document.activeElement;
    if (!a || a === document.body || !a.id) return null;
    return { id: a.id, s: a.selectionStart, e: a.selectionEnd };
  }
  function restoreFocus(f) {
    if (!f) return;
    const a = document.activeElement;
    if (a && a !== document.body && a.id === f.id) return;
    const el = $(f.id);
    if (!el) return;
    el.focus({ preventScroll: true });
    if (f.s != null && typeof el.setSelectionRange === "function") { try { el.setSelectionRange(f.s, f.e); } catch (_) {} }
  }
  function focus(id) { const el = $(id); if (el) el.focus({ preventScroll: true }); }

  function tierSig(now) {
    return [...src().items.values()].map((it) => it.id + ":" + tierOf(it, now).tier).join("|");
  }
  function tick() {
    const now = Date.now();
    if (tierSig(now) !== S.tiers) return render();
    document.querySelectorAll("[data-rel]").forEach((el) => { el.textContent = relText(el.dataset.rel, Number(el.dataset.ms), now); });
  }
  const secondsLeft = (until) => Math.max(1, Math.ceil((until - Date.now()) / 1000));
  let countdown = 0;
  function startCountdown() {
    if (countdown) return;
    countdown = setInterval(() => {
      document.querySelectorAll("[data-until]").forEach((el) => { el.textContent = t("sendIn", { n: secondsLeft(Number(el.dataset.until)) }); });
      if (!S.pending.size) { clearInterval(countdown); countdown = 0; }
    }, 1000);
  }

  /* ===== 9. Answering. A tap waits SETTINGS.undoSeconds before it is written, so Undo never races an agent. ===== */
  function onPick(it, o) {
    if (S.readOnly) return;
    if (it.marked) {
      if (!(S.confirm && S.confirm.id === it.id && S.confirm.key === o.key)) {
        S.confirm = { id: it.id, key: o.key };
        S.panel = null;
        render();
        focus("cancel-" + it.id);
      }
      return;
    }
    answer(it, { kind: "choose", key: o.key });
  }

  function answer(it, part) {
    if (S.readOnly || S.sending.has(it.id)) return;
    const prev = S.pending.get(it.id);
    if (prev) clearTimeout(prev.timer);
    const a = { v: 1, item_id: it.id, item_rev: it.rev, kind: part.kind, answered_at: null, answered_by: S.userId || null };
    if (part.key) a.key = part.key;
    if (part.note) a.note = part.note;
    if (part.kind === "reassign") a.reassign_to = part.reassign_to || null;
    const until = Date.now() + SETTINGS.undoSeconds * 1000;
    S.pending.set(it.id, { answer: a, until, timer: setTimeout(() => commit(it.id), SETTINGS.undoSeconds * 1000), view: S.view });
    S.reopen.delete(it.id);
    S.confirm = null;
    S.panel = null;
    startCountdown();
    render();
    focus("rowbtn-" + it.id);
    announce(answerLine(a, it, "sending") + t("sentenceSep") + t("sendIn", { n: SETTINGS.undoSeconds }));
  }

  function takeBack(id) {
    const p = S.pending.get(id);
    if (!p) return;
    clearTimeout(p.timer);
    S.pending.delete(id);
    render();
    focus("t-" + id);
    announce(t("undone"));
  }

  async function commit(id) {
    const p = S.pending.get(id);
    if (!p) return;
    clearTimeout(p.timer);
    const source = p.view === "demo" ? data.demo : data.live;
    const answer = { ...p.answer, answered_at: new Date().toISOString() };
    S.sending.add(id);
    render();
    try {
      await source.store.writeAnswer(id, answer);
      source.answers.set(id, answer);
      S.pending.delete(id);
      S.recent.add(id);
      S.drafts.delete(id); S.rdrafts.delete(id); S.pick.delete(id); S.to.delete(id);
      const item = source.items.get(id);
      if (item) announce(answerLine(answer, item, "sent"));
    } catch (e) {
      S.pending.delete(id);
      failed(e, source.items.get(id));
    } finally {
      S.sending.delete(id);
      render();
      if (document.activeElement === document.body) focus("rowbtn-" + id);
    }
  }
  // Leaving the page (or the phone locking it) sends what is waiting instead of dropping it.
  function flushAll() { for (const id of [...S.pending.keys()]) commit(id); }

  function failed(e, it) {
    const code = e && e.code;
    const title = it ? quote(it.title) : "";
    if (code === "invalid_argument") { S.readOnly = true; toast(t("readOnly")); }
    else if (code === "quota_exceeded") toast(t("quota", { title }));
    else if (code === "revoked") { S.fatal = t("revoked"); S.readOnly = true; }
    else toast(t("writeFail", { title }));
  }

  function toast(message) {
    const box = $("toast");
    const close = $("toast-close");
    close.textContent = t("close");
    close.onclick = () => { box.hidden = true; };
    box.hidden = false;
    $("toast-msg").textContent = "";
    setTimeout(() => { $("toast-msg").textContent = message; }, 30);
  }
  function announce(message) {
    const live = $("live");
    live.textContent = "";
    setTimeout(() => { live.textContent = message; }, 30);
  }

  /* ===== 10. Start ===== */
  function applyConfig() {
    const cfg = src().config;
    setLocale((cfg && str(cfg.locale)) || SETTINGS.locale);
  }
  function onError(e) {
    const code = e && e.code;
    S.fatal = code === "revoked" ? t("revoked") : t("loadFail");
    if (code === "revoked") S.readOnly = true;
    if (data.live) data.live.loaded = true;
    render();
  }
  function showDemo(on) {
    if (on && !data.demo) data.demo = demoSource();
    S.view = on ? "demo" : "live";
    S.panel = null; S.confirm = null;
    applyConfig();
    render();
    window.scrollTo(0, 0);
    focus(on ? "back-live" : "mine-h");
  }

  async function boot(saved) {
    if (saved && Array.isArray(saved.drafts)) S.drafts = new Map(saved.drafts);
    if (saved && Array.isArray(saved.open)) S.open = new Set(saved.open);
    setLocale(SETTINGS.locale);
    render();
    const host = window.claude;
    const inClaude = !!(host && typeof host.use === "function");
    if (SETTINGS.mode === "demo" || (SETTINGS.mode === "auto" && !inClaude)) {
      S.mode = "demo";
      S.view = "demo";
      data.demo = demoSource();
      applyConfig();
      render();
    } else {
      let db = null;
      let user = null;
      if (inClaude) {
        try { [db, user] = await Promise.all([host.use("db"), host.use("user")]); } catch (_) { db = null; }
      }
      if (!db) {
        S.mode = "offline";          // never fall back to made-up items on a live inbox
        render();
      } else {
        if (user) {
          try { S.isOwner = !!(await user.isOwner()); } catch (_) {}
          try { S.userId = await user.id(); } catch (_) {}
          try { if ((await user.can("data.write")) === false) S.readOnly = true; } catch (_) {}
        }
        S.mode = "live";
        data.live = liveSource(db);
        data.live.start();
        render();
      }
    }
    setInterval(() => { if (!document.hidden) tick(); }, 30000);
    document.addEventListener("visibilitychange", () => { if (document.hidden) flushAll(); else tick(); });
    window.addEventListener("pagehide", flushAll);
  }

  const hot = window.claude && window.claude.hot;
  try {
    if (hot && typeof hot.snapshot === "function") hot.snapshot(() => { flushAll(); return { drafts: [...S.drafts], open: [...S.open] }; });
  } catch (_) {}
  if (hot && typeof hot.ready === "function") hot.ready(boot);
  else boot((hot && hot.data) || {});
})();
</script>
